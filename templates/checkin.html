{% extends "base.html" %}

{% block title %}Daily Check-in - Student Wellness Tracker{% endblock %}

{% block content %}
<section class="page">
    <h1>Daily Check-in</h1>
    <p>Tell us about your day and get personalised suggestions. It takes less than a minute.</p>

    {% if error %}
        <p class="error-box">{{ error }}</p>
    {% endif %}

    <form id="checkinForm" action="{{ url_for('result') }}" method="POST" class="form-box">

        <div class="form-grid">
            <div>
                <label for="sleep">😴 Hours of sleep last night</label>
                <input type="number" id="sleep" name="sleep" step="0.5" placeholder="e.g. 7" required>
            </div>
            <div>
                <label for="water">💧 Glasses of water today</label>
                <input type="number" id="water" name="water" placeholder="e.g. 8" required>
            </div>
            <div>
                <label for="exercise">🏃 Minutes of exercise today</label>
                <input type="number" id="exercise" name="exercise" placeholder="e.g. 30" required>
            </div>
        </div>

        <label>How are you feeling today?</label>
        <div class="mood-options">
            <input type="radio" id="mood-happy" name="mood" value="Happy" required>
            <label for="mood-happy">😊 Happy</label>

            <input type="radio" id="mood-calm" name="mood" value="Calm">
            <label for="mood-calm">😌 Calm</label>

            <input type="radio" id="mood-tired" name="mood" value="Tired">
            <label for="mood-tired">😴 Tired</label>

            <input type="radio" id="mood-stressed" name="mood" value="Stressed">
            <label for="mood-stressed">😟 Stressed</label>
        </div>

        <p id="errorMsg" class="error"></p>

        <button type="submit" class="btn">Get My Suggestions</button>
    </form>
</section>

<script src="{{ url_for('static', filename='js/script.js') }}"></script>
{% endblock %}
